[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
dotenvy = { version = "0.15.7", optional = true }
toasty = { version = "0.7.0", features = ["postgresql", "sqlite"], optional = true }
taste-db = { path = "../taste-db", optional = true }
moka = { version = "0.12.15", features = ["future"], optional = true }
tokio = { version = "1.52.3", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tafl-game = { path = "../tafl-game", optional = true }
futures = { version = "0.3", optional = true }
dashmap = { version = "6", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }

[features]
server = ["dioxus/server", "dep:dotenvy", "dep:toasty", "dep:moka", "dep:tokio", "taste-db/server", "dep:tafl-game", "dep:futures", "dep:dashmap", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
