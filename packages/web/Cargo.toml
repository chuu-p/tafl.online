[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
tokio = { version = "1", features = ["full"], optional = true }
web-sys = { version = "0.3.60", features = ["console"], optional = true }
js-sys = { version = "0.3.103", optional = true }

[features]
default = []
web = ["dioxus/web", "dep:web-sys", "dep:js-sys"]
server = ["dioxus/server", "ui/server",  "dep:tokio"]
