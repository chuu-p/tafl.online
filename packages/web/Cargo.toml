[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
api = { workspace = true }
tafl-game = { path = "../tafl-game", default-features = false }
serde_json = "1"
fast_qr = { version = "0.13", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["full"], optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3.60", features = ["console", "Window"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", optional = true }

[features]
default = ["web", "server"]
web = ["dioxus/web", "ui/web", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:gloo-timers"]
server = ["dioxus/server", "ui/server",  "dep:tokio"]
