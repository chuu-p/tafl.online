[package]
name = "tafl-game"
version = "0.1.0"
edition = "2024"

[dependencies]
repl-rs = { version = "0.2.11", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }

[features]
default = ["repl"]
repl = ["dep:repl-rs"]

[[bin]]
name = "repl"
path = "src/bin/repl.rs"
required-features = ["repl"]
